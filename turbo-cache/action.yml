name: Vexel CI Turbo cache
description: >-
  Connect turbo to the repository's remote cache (README.md), so a
  lint, typecheck or test task whose inputs did not change since any earlier run replays its result
  instead of running. Pull request runs, the merge gate included, and the integration branch's push
  runs read and write it. Manual runs and the pushes to other branches (main, release/**,
  hotfix/**) only write: they run every task, so each release proves the whole suite without the
  cache and refreshes it. Without the credentials (a run that gets no secrets) turbo keeps its
  local cache, which a clean checkout starts empty. Every turbo run of the job writes a run summary
  that the verify-cache-hit action reads. Run it after the setup action: it puts the Node and Bun versions in every task's hash.

inputs:
  api-url:
    description: The cache Worker's URL (repository variable TURBO_API).
    required: false
    default: ''
  token:
    description: The cache's bearer token (repository secret TURBO_TOKEN).
    required: false
    default: ''
  signature-key:
    description: >-
      The key turbo signs and verifies every artifact with (repository secret
      TURBO_REMOTE_CACHE_SIGNATURE_KEY), so a write that did not come from CI is never replayed.
    required: false
    default: ''
  team:
    description: TURBO_TEAM, the cache namespace; empty uses the repository's name.
    required: false
    default: ''
  integration-branch:
    description: The branch whose push runs read the cache too.
    required: false
    default: develop

outputs:
  reads-remote:
    description: "'true' when this job's turbo runs may replay results from the remote cache."
    value: ${{ steps.connect.outputs.reads-remote }}

runs:
  using: composite
  steps:
    - name: Connect turbo to the remote cache
      id: connect
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        TOKEN: ${{ inputs.token }}
        SIGNATURE_KEY: ${{ inputs.signature-key }}
        TEAM: ${{ inputs.team || github.event.repository.name }}
        INTEGRATION_BRANCH: ${{ inputs.integration-branch }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        # Explicit, so turbo's local cache is the workspace's (in a linked git worktree turbo would
        # use the main worktree's .turbo), and the run summaries land beside it.
        echo "TURBO_CACHE_DIR=$GITHUB_WORKSPACE/.turbo/cache" >> "$GITHUB_ENV"
        echo "TURBO_RUN_SUMMARY=true" >> "$GITHUB_ENV"
        echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
        # The runtimes belong in every task's hash (CI_RUNTIME in turbo.json's globalEnv): a Node or
        # Bun upgrade must not replay results from the old ones.
        echo "CI_RUNTIME=node-$(node --version)-bun-$(bun --version)" >> "$GITHUB_ENV"

        if [ -z "$API_URL" ] || [ -z "$TOKEN" ] || [ -z "$SIGNATURE_KEY" ]; then
          echo "No remote cache credentials: turbo uses its local cache only."
          echo "reads-remote=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        reads=false
        if [ "$EVENT_NAME" = pull_request ] || { [ "$EVENT_NAME" = push ] && [ "$REF_NAME" = "$INTEGRATION_BRANCH" ]; }; then
          reads=true
        fi

        {
          echo "TURBO_API=$API_URL"
          echo "TURBO_TOKEN=$TOKEN"
          echo "TURBO_TEAM=$TEAM"
          echo "TURBO_REMOTE_CACHE_SIGNATURE_KEY=$SIGNATURE_KEY"
          if [ "$reads" = true ]; then
            echo "TURBO_CACHE=local:rw,remote:rw"
          else
            echo "TURBO_CACHE=local:rw,remote:w"
          fi
        } >> "$GITHUB_ENV"

        echo "reads-remote=$reads" >> "$GITHUB_OUTPUT"
        if [ "$reads" = true ]; then
          echo "Remote cache: read and write."
        else
          echo "Remote cache: write only (a $EVENT_NAME run on $REF_NAME proves every task)."
        fi
